<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Portfolio CLI</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="crt">
    <div id="boot-screen"></div>
    <div id="terminal" class="hidden">
        <div id="output"></div>
        
        <!-- 대시보드 영역 추가 -->
        <div id="dashboard">
            <div id="category-nav"></div>
            <div id="project-gallery"></div>
        </div>

        <div id="input-line">
            <span id="prompt">C:\USER\PORTFOLIO></span>
            <input type="text" id="command-input" autofocus spellcheck="false">
        </div>
    </div>
    <div id="modal-overlay" class="hidden">
        <div id="modal-content">
            <span id="modal-close">[CLOSE]</span>
            <div id="modal-body"></div>
        </div>
    </div>
    <div class="scanlines"></div>
    <script src="assets/js/script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Portfolio Admin Panel - Advanced</title>
    <style>
        :root { --primary: #007bff; --success: #28a745; --danger: #dc3545; }
        body { font-family: 'Segoe UI', sans-serif; padding: 30px; background: #eef2f7; color: #333; }
        .container { max-width: 900px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h1, h2, h3 { color: #222; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .section { margin-bottom: 40px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 14px; }
        input, textarea, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        .project-item { border: 1px solid #eee; padding: 20px; margin-bottom: 20px; border-radius: 8px; background: #fafafa; position: relative; }
        .project-item:hover { border-color: var(--primary); }
        .flex-row { display: flex; gap: 10px; }
        .flex-row > div { flex: 1; }
        button { padding: 10px 20px; cursor: pointer; border: none; border-radius: 6px; font-weight: bold; transition: 0.2s; }
        .btn-add { background: var(--primary); color: white; }
        .btn-save { background: var(--success); color: white; width: 100%; font-size: 18px; margin-top: 20px; }
        .btn-delete { background: var(--danger); color: white; font-size: 12px; padding: 5px 10px; position: absolute; top: 10px; right: 10px; }
        .category-tag { display: inline-block; background: #ddd; padding: 2px 8px; border-radius: 4px; margin-right: 5px; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Portfolio Manager</h1>

        <!-- Profile Section -->
        <div class="section">
            <h3>1. Profile & Settings</h3>
            <div class="flex-row">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="admin-name">
                </div>
                <div class="form-group">
                    <label>Title</label>
                    <input type="text" id="admin-title">
                </div>
            </div>
            <div class="form-group">
                <label>Available Categories (Comma separated to add new)</label>
                <input type="text" id="admin-categories" placeholder="Animation, Illustration, Music...">
            </div>
        </div>

        <!-- Projects Section -->
        <div class="section">
            <h3>2. Projects List</h3>
            <div id="project-list"></div>
            <button class="btn-add" onclick="addProject()">+ Add New Project</button>
        </div>

        <div class="section">
            <button class="btn-save" onclick="saveData()">Save Changes & Download content.json</button>
            <p style="text-align: center; color: #666;"><small>다운로드한 파일을 프로젝트 루트의 <code>content.json</code>에 덮어쓰세요.</small></p>
        </div>
    </div>

    <script>
        let data = null;

        async function init() {
            try {
                const res = await fetch('content.json');
                data = await res.json();
                
                document.getElementById('admin-name').value = data.profile.name;
                document.getElementById('admin-title').value = data.profile.title;
                document.getElementById('admin-categories').value = data.settings.categories.join(', ');
                
                renderProjects();
            } catch (e) { alert("content.json을 불러올 수 없습니다."); }
        }

        function renderProjects() {
            const list = document.getElementById('project-list');
            list.innerHTML = '';
            
            // 연도순 정렬 (내림차순)
            const sortedProjects = [...data.projects].sort((a, b) => b.year - a.year);

            sortedProjects.forEach((p, idx) => {
                const item = document.createElement('div');
                item.className = 'project-item';
                
                // 카테고리 드롭다운 생성
                const catOptions = data.settings.categories.map(cat => 
                    `<option value="${cat}" ${p.category === cat ? 'selected' : ''}>${cat}</option>`
                ).join('');

                item.innerHTML = `
                    <button class="btn-delete" onclick="deleteProject(${p.id})">Delete</button>
                    <div class="flex-row">
                        <div class="form-group">
                            <label>Project Title</label>
                            <input type="text" value="${p.title}" onchange="updateProject(${p.id}, 'title', this.value)">
                        </div>
                        <div class="form-group" style="flex: 0.3;">
                            <label>Year</label>
                            <input type="number" value="${p.year}" onchange="updateProject(${p.id}, 'year', parseInt(this.value))">
                        </div>
                    </div>
                    <div class="flex-row">
                        <div class="form-group">
                            <label>Category</label>
                            <select onchange="updateProject(${p.id}, 'category', this.value)">
                                ${catOptions}
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Type</label>
                            <select onchange="updateProject(${p.id}, 'type', this.value)">
                                <option value="video" ${p.type==='video'?'selected':''}>YouTube Video</option>
                                <option value="image" ${p.type==='image'?'selected':''}>External Image URL</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>URL (YouTube Embed or Image Link)</label>
                        <input type="text" value="${p.url}" onchange="updateProject(${p.id}, 'url', this.value)">
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <textarea onchange="updateProject(${p.id}, 'description', this.value)">${p.description}</textarea>
                    </div>
                `;
                list.appendChild(item);
            });
        }

        function updateProject(id, field, value) {
            const p = data.projects.find(proj => proj.id === id);
            if (p) p[field] = value;
        }

        function addProject() {
            const newId = data.projects.length > 0 ? Math.max(...data.projects.map(p => p.id)) + 1 : 1;
            data.projects.push({
                id: newId,
                title: "New Project",
                type: "video",
                url: "",
                year: new Date().getFullYear(),
                category: data.settings.categories[0] || "General",
                tags: [],
                description: ""
            });
            renderProjects();
        }

        function deleteProject(id) {
            if(confirm("정말 삭제하시겠습니까?")) {
                data.projects = data.projects.filter(p => p.id !== id);
                renderProjects();
            }
        }

        function saveData() {
            data.profile.name = document.getElementById('admin-name').value;
            data.profile.title = document.getElementById('admin-title').value;
            data.settings.categories = document.getElementById('admin-categories').value.split(',').map(s => s.trim()).filter(s => s !== "");

            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'content.json';
            a.click();
        }

        init();
    </script>
</body>
</html>

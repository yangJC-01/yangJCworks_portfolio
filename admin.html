<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Portfolio Manager (Spreadsheet Mode)</title>
    <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>
    <div id="toast"></div>
    <div class="container">
        <header>
            <h1>📊 Portfolio Manager</h1>
            <button class="btn btn-save" onclick="saveData()">💾 Save content.json</button>
        </header>

        <div class="instruction">
            * Changes are saved locally. Click <b>Save</b> to download the final <code>content.json</code>.
        </div>

        <div class="profile-bar">
            <strong>Profile:</strong>
            <input type="text" id="admin-name" placeholder="Name" oninput="autoSave()">
            <input type="text" id="admin-title" placeholder="Title" oninput="autoSave()">
            <input type="text" id="admin-categories" placeholder="Categories (comma separated)" oninput="updateCategories(this.value)">
        </div>

        <div class="spreadsheet-container">
            <table>
                <thead>
                    <tr>
                        <th style="width: 50px;">Year</th>
                        <th style="width: 200px;">Title</th>
                        <th style="width: 120px;">Category</th>
                        <th style="width: 100px;">Type</th>
                        <th style="width: 60px;">Thumb</th>
                        <th>URL / Media Source</th>
                        <th style="width: 150px;">Thumbnail (Opt)</th>
                        <th style="width: 40px;">-</th>
                    </tr>
                </thead>
                <tbody id="project-body"></tbody>
            </table>
        </div>
        
        <button class="btn btn-add" onclick="addProject()">+ Add New Project</button>
        <button onclick="clearTempData()" style="float:right; background:none; border:none; color:#999; cursor:pointer; text-decoration:underline;">Reset Draft</button>
    </div>

    <script>
        let data = null;
        const LOCAL_STORAGE_KEY = 'portfolio_draft_data';

        async function init() {
            const savedDraft = localStorage.getItem(LOCAL_STORAGE_KEY);
            if (savedDraft) {
                data = JSON.parse(savedDraft);
            } else {
                try {
                    const res = await fetch('content.json');
                    data = await res.json();
                } catch (e) {
                    data = { profile: { name: "", title: "" }, settings: { categories: ["General"] }, projects: [] };
                }
            }
            fillFields();
            renderProjects();
        }

        function fillFields() {
            document.getElementById('admin-name').value = data.profile.name;
            document.getElementById('admin-title').value = data.profile.title;
            document.getElementById('admin-categories').value = data.settings.categories.join(', ');
        }

        function getDirectImgurUrl(url) {
            if (!url) return url;
            if (url.includes('imgur.com') && !url.includes('i.imgur.com')) {
                if (!url.includes('/a/') && !url.includes('/gallery/')) {
                    const id = url.split('/').pop();
                    return `https://i.imgur.com/${id}.jpg`;
                }
            }
            return url;
        }

        function getThumbnail(p) {
            if (p.thumbnail_url) return getDirectImgurUrl(p.thumbnail_url);
            if (p.type === 'image') return getDirectImgurUrl(p.url);
            if (p.type === 'video') {
                let vidId = "";
                if (p.url.includes('v=')) vidId = p.url.split('v=')[1].split('&')[0];
                else if (p.url.includes('youtu.be/')) vidId = p.url.split('/').pop().split('?')[0];
                else vidId = p.url.split('/').pop().split('?')[0];
                return `https://img.youtube.com/vi/${vidId}/mqdefault.jpg`;
            }
            return 'https://via.placeholder.com/50x30?text=WEB';
        }

        function renderProjects() {
            const body = document.getElementById('project-body');
            body.innerHTML = '';
            
            data.projects.sort((a, b) => b.year - a.year).forEach((p) => {
                const tr = document.createElement('tr');
                
                const catOptions = data.settings.categories.map(cat => 
                    `<option value="${cat}" ${p.category === cat ? 'selected' : ''}>${cat}</option>`
                ).join('');

                const thumb = getThumbnail(p);

                tr.innerHTML = `
                    <td><input type="number" value="${p.year}" oninput="updateProject(${p.id}, 'year', parseInt(this.value))"></td>
                    <td><input type="text" value="${p.title}" oninput="updateProject(${p.id}, 'title', this.value)"></td>
                    <td><select onchange="updateProject(${p.id}, 'category', this.value)">${catOptions}</select></td>
                    <td>
                        <select onchange="updateProject(${p.id}, 'type', this.value); renderProjects();">
                            <option value="video" ${p.type==='video'?'selected':''}>Video</option>
                            <option value="image" ${p.type==='image'?'selected':''}>Image</option>
                            <option value="website" ${p.type==='website'?'selected':''}>Website</option>
                        </select>
                    </td>
                    <td class="thumbnail-cell"><img src="${thumb}" onerror="this.src='https://via.placeholder.com/50x30?text=ERR'"></td>
                    <td><input type="text" value="${p.url}" placeholder="URL" oninput="updateProject(${p.id}, 'url', this.value)"></td>
                    <td><input type="text" value="${p.thumbnail_url || ''}" placeholder="Thumbnail URL" oninput="updateProject(${p.id}, 'thumbnail_url', this.value)"></td>
                    <td><button class="btn-delete" onclick="deleteProject(${p.id})">×</button></td>
                `;
                body.appendChild(tr);
            });
        }

        function updateProject(id, field, value) {
            const p = data.projects.find(proj => proj.id === id);
            if (p) { p[field] = value; autoSave(); }
        }

        function addProject() {
            data.projects.push({
                id: Date.now(),
                title: "New Project",
                type: "video",
                url: "",
                year: new Date().getFullYear(),
                category: data.settings.categories[0],
                description: ""
            });
            renderProjects();
            autoSave();
        }

        function deleteProject(id) {
            if(confirm("Delete this project?")) {
                data.projects = data.projects.filter(p => p.id !== id);
                renderProjects();
                autoSave();
            }
        }

        function updateCategories(val) {
            data.settings.categories = val.split(',').map(s => s.trim()).filter(s => s !== "");
            autoSave();
            renderProjects();
        }

        function autoSave() {
            data.profile.name = document.getElementById('admin-name').value;
            data.profile.title = document.getElementById('admin-title').value;
            localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(data));
        }

        function clearTempData() {
            if(confirm("Discard all drafts and reload from file?")) {
                localStorage.removeItem(LOCAL_STORAGE_KEY);
                location.reload();
            }
        }

        function saveData() {
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'content.json';
            a.click();
            alert("✅ content.json downloaded. Overwrite the file in your folder and push to GitHub.");
        }

        init();
    </script>
</body>
</html>
